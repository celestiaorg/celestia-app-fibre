name: test
on:
  workflow_call:
    secrets:
      GH_PRIVATE_MODULES_TOKEN:
        required: true

jobs:
  test-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PRIVATE_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 #v6.2.0
        id: go
        with:
          go-version-file: "go.mod"
        env:
          GOPRIVATE: github.com/celestiaorg/*

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-

      - name: Download Go modules
        run: go mod download

      - name: Run tests in short mode
        run: make test-short
        timeout-minutes: 25

  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # sentinel value to run all other tests.
          - package: "unit"
          # split the heaviest ones
          - package: "github.com/celestiaorg/celestia-app/v6/app/test"
            pattern: "TestIntegration.*"
          - package: "github.com/celestiaorg/celestia-app/v6/app/test"
            pattern: "TestBigBlob.*|TestStandardSDK.*"
          - package: "github.com/celestiaorg/celestia-app/v6/app/test"
            pattern: "TestSquareSize.*|TestPriority.*"
          - package: "github.com/celestiaorg/celestia-app/v6/test/txsim"
          - package: "github.com/celestiaorg/celestia-app/v6/pkg/user"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PRIVATE_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 #v6.2.0
        id: go
        with:
          go-version-file: "go.mod"
        env:
          GOPRIVATE: github.com/celestiaorg/*

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-

      - name: Run tests
        run: |
          if [ "${{ matrix.package }}" = "unit" ]; then
            # run all packages except the heavy ones
            make test PACKAGES="$(go list ./... | grep -v 'app/test$' | grep -v 'test/txsim$' | grep -v 'pkg/user$' | tr '\n' ' ')"
          elif [ -n "${{ matrix.pattern }}" ]; then
            # run specific test patterns
            go test -timeout 30m -run "${{ matrix.pattern }}" ${{ matrix.package }}
          else
            # run specific package
            make test PACKAGES="${{ matrix.package }}"
          fi

  test:
    runs-on: ubuntu-latest
    needs: go-test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.go-test.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed"

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PRIVATE_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 #v6.2.0
        id: go
        with:
          go-version-file: "go.mod"
        env:
          GOPRIVATE: github.com/celestiaorg/*

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-

      - name: Generate coverage.txt
        run: make test-coverage

      - name: Upload coverage.txt
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 #v5.5.1
        with:
          files: ./coverage.txt

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PRIVATE_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 #v6.2.0
        id: go
        with:
          go-version-file: "go.mod"
        env:
          GOPRIVATE: github.com/celestiaorg/*

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-

      - name: Download Go modules
        run: go mod download

      - name: Run tests in race mode
        run: make test-race
        timeout-minutes: 45

  test-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PRIVATE_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 #v6.2.0
        id: go
        with:
          go-version-file: "go.mod"
        env:
          GOPRIVATE: github.com/celestiaorg/*

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-

      - name: Run fuzz tests
        run: make test-fuzz

  test-multiplexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PRIVATE_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 #v6.2.0
        id: go
        with:
          go-version-file: "go.mod"
        env:
          GOPRIVATE: github.com/celestiaorg/*

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-

      - name: Run multiplexer tests
        run: make test-multiplexer
