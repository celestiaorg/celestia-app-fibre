name: docker-build-publish

# DISABLED: This repo is private and containers are only needed for CI testing.
# CI tests build images locally on-demand. Uncomment triggers below to re-enable.
on:
  # push:
  #   branches:
  #     - "main"
  #     - "v*"
  #   tags:
  #     - "v*"
  # pull_request:
  # merge_group:
  workflow_dispatch:
    inputs:
      ref:
        description: "The checkout reference (ie tag, branch, sha)"
        required: true
        type: string

jobs:
  docker-standalone-build:
    permissions:
      contents: write
      packages: write
    uses: celestiaorg/.github/.github/workflows/reusable_dockerfile_pipeline.yml@9ee03305d3cc6cf520b7895436429aa853b58e70 #v0.6.4
    with:
      dockerfile: docker/standalone.Dockerfile
      checkout_ref: ${{ github.event.inputs.ref }}
      packageName: celestia-app-standalone
    secrets: inherit

  docker-multiplexer-build:
    permissions:
      contents: write
      packages: write
    uses: celestiaorg/.github/.github/workflows/reusable_dockerfile_pipeline.yml@9ee03305d3cc6cf520b7895436429aa853b58e70 #v0.6.4
    with:
      dockerfile: docker/multiplexer.Dockerfile
      checkout_ref: ${{ github.event.inputs.ref }}
      packageName: celestia-app
    secrets: inherit

  docker-txsim-build:
    permissions:
      contents: write
      packages: write
    uses: celestiaorg/.github/.github/workflows/reusable_dockerfile_pipeline.yml@9ee03305d3cc6cf520b7895436429aa853b58e70 #v0.6.4
    with:
      dockerfile: docker/txsim/Dockerfile
      packageName: txsim
      checkout_ref: ${{ github.event.inputs.ref }}
    secrets: inherit
