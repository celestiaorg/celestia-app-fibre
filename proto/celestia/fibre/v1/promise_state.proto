syntax = "proto3";

package celestia.fibre.v1;

option go_package = "github.com/celestiaorg/celestia-app/x/fibre/types";

import "cosmos_proto/cosmos.proto";

// PromiseDiffSnapshot captures the aggregated escrow adjustments that need to be
// re-applied to the PromiseState after loading committed state.
message PromiseDiffSnapshot {
  repeated PromiseSignerBalance balances = 1;
  repeated PromiseReservation reservations = 2;
}

// PromiseSignerBalance stores the reserved utia amount for a given escrow signer.
message PromiseSignerBalance {
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // amount represents the reserved utia as a decimal string.
  string amount = 2;
}

// PromiseReservation tracks per-promise metadata so expirations can release escrow.
message PromiseReservation {
  bytes hash = 1;
  string signer = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string amount = 3;
  int64 expires_at_unix = 4;
}
